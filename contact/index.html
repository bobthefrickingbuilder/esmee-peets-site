<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Esmée Peets</title>
<meta name="description" content="Get in touch with Esmée Peets for drawing lessons, workshops, and collaborations.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/styles.css">
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div class="curtain"><span></span><span></span><span></span><span></span></div>
<div class="grain"></div>
<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<header class="site-header">
  <a href="/" class="wordmark">Esm<em>é</em>e Peets</a>
  <nav class="main-nav">
    <a href="/work/">Work</a>
    <a href="/about/">About</a>
    <a href="/contact/" class="is-current">Contact</a>
  </nav>
  <button class="menu-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
</header>

<main>
  <div class="wrap contact-hero-grid">
    <div data-reveal>
      <span class="eyebrow">Contact</span>
      <h1 style="font-weight:var(--fw-light); line-height:.95; font-size:clamp(2.6rem,8vw,6rem); margin-top:.6rem;">&Eacute;crivez-<em style="font-style:italic; color:var(--rose-dust);">moi.</em></h1>
      <p style="max-width:38ch; color:var(--ink-dim); margin-top:1.6rem;">Drawing lessons, workshops, collaborations, or a question about a piece &mdash; in English or French.</p>
      <a href="mailto:esmeepeets@gmail.com" class="contact-email" data-cursor="Email">esmeepeets@gmail.com</a>
      <div class="contact-info-row">
        <div><span class="eyebrow">Based in</span><div>Montr&eacute;al &amp; Ottawa</div></div>
        <div><span class="eyebrow">Languages</span><div>English &middot; Fran&ccedil;ais</div></div>
      </div>
    </div>

    <div class="contact-panel" data-reveal data-delay=".15">
      <form class="contact-form">
        <div>
          <span class="eyebrow" style="color:var(--ink-faint);">About</span>
          <div class="reason-pills">
            <button type="button" class="reason-pill is-active">Drawing lessons</button>
            <button type="button" class="reason-pill">Workshops</button>
            <button type="button" class="reason-pill">Collaboration</button>
            <button type="button" class="reason-pill">Something else</button>
          </div>
        </div>
        <label class="field">
          <span class="eyebrow" style="color:var(--ink-faint);">Name</span>
          <input type="text" required>
        </label>
        <label class="field">
          <span class="eyebrow" style="color:var(--ink-faint);">Email</span>
          <input type="email" required>
        </label>
        <label class="field">
          <span class="eyebrow" style="color:var(--ink-faint);">Message</span>
          <textarea rows="4" required></textarea>
        </label>
        <button type="submit" class="btn btn-dark" data-cursor="Send">Send message <span class="btn-arrow">&rarr;</span></button>
      </form>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <span>&copy; 2026 Esm&eacute;e Peets</span>
      <a href="mailto:esmeepeets@gmail.com">esmeepeets@gmail.com</a>
    </div>
  </div>
</footer>

<script src="/assets/site.js"></script>
</body>
</html>
